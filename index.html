<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Nivtec kalkulačka pódia: dosky, nohy, schody, plachty, zábradlie a výstuhy. Časť pripravovanej aplikácie RigTrack." />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Nivtec kalkulačka pódia</title>
    <script>
      // Režim sa nastaví ešte pred vykreslením, aby stránka nebliklo: voľba používateľa, inak zariadenie.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('nivtec:theme')
        } catch (error) {}
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
